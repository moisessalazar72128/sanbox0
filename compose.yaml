name: plc-access-lab
x-app: &app
  build: .
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  relay:
    <<: *app
    environment:
      USERS_FILE: /run/secrets/users.json
      GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
      RELAY_ALLOW_WRITES: "${RELAY_ALLOW_WRITES:-false}"
    volumes:
      - ./secrets/users.json:/run/secrets/users.json:ro
      - ./secrets/gateway_token:/run/secrets/gateway_token:ro
    networks: [backend]
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8443:443"]
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend, outbound]
    depends_on: [relay]
  gateway:
    <<: *app
    command: [python, -m, plc_access.gateway]
    environment:
      RELAY_URL: https://proxy
      RELAY_CA_FILE: /run/ca/root.crt
      GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
      PLC_HOST: simulator
      GATEWAY_READ_ONLY: "${GATEWAY_READ_ONLY:-true}"
    volumes:
      - ./secrets/gateway_token:/run/secrets/gateway_token:ro
      - gateway_ca:/run/ca:ro
    networks: [outbound, plc]
    depends_on: [proxy, simulator, export_ca]
  export_ca:
    image: alpine:3.22.2
    restart: on-failure
    command: [sh, -ec, "while [ ! -f /data/caddy/pki/authorities/local/root.crt ]; do sleep 1; done; cp /data/caddy/pki/authorities/local/root.crt /ca/root.crt; chmod 644 /ca/root.crt"]
    volumes:
      - caddy_data:/data:ro
      - gateway_ca:/ca
    network_mode: none
    depends_on: [proxy]
  simulator:
    <<: *app
    command: [python, -m, plc_access.simulator]
    networks: [plc]
networks:
  backend: {internal: true}
  plc: {internal: true}
  outbound: {}
volumes:
  caddy_data:
  caddy_config:
  gateway_ca:
